[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proberca"
version = "0.1.0"
description = "probeRCA P0 single-VM pseudo-distributed validation scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "pytest",
  "pyarrow==24.0.*",
]

[project.scripts]
proberca-replay = "proberca.cli.replay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
