[build-system]
requires = ["setuptools==79.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "proberca"
version = "0.1.0"
description = "probeRCA P0 single-VM pseudo-distributed validation scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.21.5",
  "scipy==1.8.0",
  "PyYAML==6.0.3",
  "pyarrow==24.0.0",
  "kubernetes==35.0.0",
  "requests==2.25.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "tomli==2.4.1; python_version < '3.11'",
]

[project.scripts]
proberca-replay = "proberca.cli.replay:main"
proberca-live = "proberca.cli.live:main"
proberca-seal-collection = "proberca.cli.seal_collection:main"
proberca-analyze-collection = "proberca.cli.analyze_collection:main"

[tool.setuptools.packages.find]
include = ["proberca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
