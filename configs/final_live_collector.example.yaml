      label_mapping: *tcp_edge_labels
      required_labels: *tcp_edge_required
      optional_labels: *edge_optional
      series_labels: *tcp_edge_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: tcp-edge-timeout-total
      component: edge_timeout_total
      promql: 'proberca_tcp_edge_timeout_total{source_coverage=~"0|1"}'
      label_mapping: *tcp_edge_labels
      required_labels: *tcp_edge_required
      optional_labels: *edge_optional
      series_labels: *tcp_edge_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: tcp-edge-latency-histogram
      component: edge_latency_histogram
      promql: 'proberca_tcp_edge_latency_milliseconds_bucket{source_coverage=~"0|1"}'
      label_mapping: &edge_histogram_labels
        namespace: namespace
        src_service: src_service
        dst_namespace: dst_namespace
        dst_service: dst_service
        protocol: protocol
        source_series: source_series
        source_coverage: source_coverage
        histogram_upper_bound: le
      required_labels: &edge_histogram_required [namespace, src_service, dst_namespace, dst_service, protocol, source_series, source_coverage, le]
      optional_labels: *edge_optional
      series_labels: *tcp_edge_series
      histogram_le_label: le
      value_scale: 1.0
      histogram_bound_scale: 1.0

    # DNS calling-service -> resolver-service primitives.
    - query_id: dns-query-total
      component: dns_query_total
      promql: 'proberca_dns_edge_query_total'
      label_mapping: &dns_edge_labels
        namespace: namespace
        src_service: src_service
        dst_namespace: dst_namespace
        dst_service: dst_service
        protocol: protocol
        source_series: source_series
      required_labels: &dns_edge_required [namespace, src_service, dst_namespace, dst_service, protocol, source_series]
      optional_labels: *edge_optional
      series_labels: &dns_edge_series [namespace, src_service, dst_namespace, dst_service, protocol, source_series]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: dns-timeout-total
      component: dns_timeout_total
