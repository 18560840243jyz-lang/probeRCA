      label_mapping: *dns_edge_labels
      required_labels: *dns_edge_required
      optional_labels: *edge_optional
      series_labels: *dns_edge_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: dns-error-rcode-total
      component: dns_error_rcode_total
      promql: 'proberca_dns_edge_error_rcode_total'
      label_mapping: *dns_edge_labels
      required_labels: *dns_edge_required
      optional_labels: *edge_optional
      series_labels: *dns_edge_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: dns-latency-histogram
      component: dns_latency_histogram
      promql: 'proberca_dns_edge_latency_milliseconds_bucket'
      label_mapping: &dns_edge_histogram_labels
        namespace: namespace
        src_service: src_service
        dst_namespace: dst_namespace
        dst_service: dst_service
        protocol: protocol
        source_series: source_series
        histogram_upper_bound: le
      required_labels: &dns_edge_histogram_required [namespace, src_service, dst_namespace, dst_service, protocol, source_series, le]
      optional_labels: *edge_optional
      series_labels: *dns_edge_series
      histogram_le_label: le
      value_scale: 1.0
      histogram_bound_scale: 1.0
