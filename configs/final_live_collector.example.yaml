schema_version: probeRCA-final-live-collector-v1
cluster_id: kind-proberca-ob
window_sec: 1
collection_delay_sec: 1.0
window_lead_sec: 1.0

kubernetes:
  enabled: true
  cluster_id: kind-proberca-ob
  in_cluster: false
  kubeconfig_path: /home/jyz/.kube/config
  context: kind-proberca-ob
  namespaces: [online-boutique, kube-system]
  namespace_label_selector: null
  field_selectors: {}
  resync_timeout_sec: 60.0
  watch_timeout_sec: 30.0
  reconnect_initial_sec: 1.0
  reconnect_max_sec: 30.0
  allow_watch_bookmarks: true
  endpoint_ready_policy: ready_only
  include_terminating_endpoints: false
  include_persistent_volumes: true
  include_volume_attachments: false
  include_jobs: false
  include_external_name_services: false
  pod_service_ambiguity_policy: fail
  inventory_stale_after_sec: 120.0
  topology_snapshot_each_window: true
  explicit_resource_annotation_prefix: proberca.io/resource-

prometheus:
  base_url: http://127.0.0.1:9090
  timeout_sec: 10.0
  maximum_sample_age_sec: 2.0
  reject_warnings: true
  queries:
    # Service request symptoms. The exporter must expose raw counters and
    # cumulative buckets; rate() and histogram_quantile() are forbidden here.
    - query_id: service-request-total
      component: request_total
      promql: 'proberca_service_request_total{source_coverage=~"0|1"}'
      label_mapping: &service_request_labels
        namespace: namespace
        pod: pod
        container: container
        source_series: source_series
        source_coverage: source_coverage
      required_labels: &service_request_required [namespace, pod, container, source_series, source_coverage]
      optional_labels: &service_optional [job, instance]
      series_labels: &service_request_series [namespace, pod, container, source_series]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-request-error-total
      component: request_error_total
      promql: 'proberca_service_request_error_total{source_coverage=~"0|1"}'
      label_mapping: *service_request_labels
      required_labels: *service_request_required
      optional_labels: *service_optional
      series_labels: *service_request_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-request-timeout-total
      component: request_timeout_total
      promql: 'proberca_service_request_timeout_total{source_coverage=~"0|1"}'
      label_mapping: *service_request_labels
      required_labels: *service_request_required
      optional_labels: *service_optional
      series_labels: *service_request_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-request-latency-histogram
      component: request_latency_histogram
      promql: 'proberca_service_request_latency_milliseconds_bucket{source_coverage=~"0|1"}'
      label_mapping: &service_histogram_labels
        namespace: namespace
        pod: pod
        container: container
        source_series: source_series
        source_coverage: source_coverage
        histogram_upper_bound: le
      required_labels: &service_histogram_required [namespace, pod, container, source_series, source_coverage, le]
      optional_labels: *service_optional
      series_labels: *service_request_series
      histogram_le_label: le
      value_scale: 1.0
      histogram_bound_scale: 1.0

    # Service CPU and memory. Counter conversion remains in the collector.
    - query_id: service-cpu-time
      component: cpu_time_ns_total
      promql: 'proberca_container_cpu_time_nanoseconds_total'
      label_mapping: &service_labels
        namespace: namespace
        pod: pod
        container: container
        source_series: source_series
      required_labels: &service_required [namespace, pod, container, source_series]
      optional_labels: *service_optional
      series_labels: &service_series [namespace, pod, container, source_series]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-allocated-cpu
      component: allocated_cpu_cores
      promql: 'proberca_container_allocated_cpu_cores'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-cpu-throttled-periods
      component: cpu_nr_throttled_total
      promql: 'proberca_container_cpu_throttled_periods_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-cpu-periods
      component: cpu_nr_periods_total
      promql: 'proberca_container_cpu_periods_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-memory-working-set
      component: memory_working_set_bytes
      promql: 'proberca_container_memory_working_set_bytes'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-memory-limit
      component: memory_limit_bytes
      promql: 'proberca_container_memory_limit_bytes'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0

    # Always-on eBPF/cgroup-map exporter primitives.
    - query_id: service-io-psi
      component: io_psi_some_ns_total
      promql: 'proberca_cgroup_io_psi_some_nanoseconds_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-active-task-time
      component: active_task_ns_total
      promql: 'proberca_cgroup_active_task_nanoseconds_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-futex-wait
      component: futex_wait_ns_total
      promql: 'proberca_cgroup_futex_wait_nanoseconds_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-active-thread-time
      component: active_thread_ns_total
      promql: 'proberca_cgroup_active_thread_nanoseconds_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-socket-backlog-overflow
      component: socket_backlog_overflow_total
      promql: 'proberca_cgroup_socket_backlog_overflow_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-socket-accept-fail
      component: socket_accept_fail_total
      promql: 'proberca_cgroup_socket_accept_fail_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-socket-local-rst
      component: socket_local_rst_total
      promql: 'proberca_cgroup_socket_local_rst_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-socket-local-drop
      component: socket_local_drop_total
      promql: 'proberca_cgroup_socket_local_drop_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: service-socket-operations
      component: socket_ops_total
      promql: 'proberca_cgroup_socket_operations_total'
      label_mapping: *service_labels
      required_labels: *service_required
      optional_labels: *service_optional
      series_labels: *service_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0

    # Host metrics.
    - query_id: host-cpu-psi
      component: node_cpu_psi_some_ns_total
      promql: 'proberca_node_cpu_psi_some_nanoseconds_total'
      label_mapping: &host_labels {node: node}
      required_labels: &host_required [node]
      optional_labels: &host_optional [job, instance]
      series_labels: &host_series [node]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-memory-psi
      component: node_memory_psi_some_ns_total
      promql: 'proberca_node_memory_psi_some_nanoseconds_total'
      label_mapping: *host_labels
      required_labels: *host_required
      optional_labels: *host_optional
      series_labels: *host_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-io-psi
      component: node_io_psi_some_ns_total
      promql: 'proberca_node_io_psi_some_nanoseconds_total'
      label_mapping: *host_labels
      required_labels: *host_required
      optional_labels: *host_optional
      series_labels: *host_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-nic-rx-drop
      component: node_nic_rx_drop_total
      promql: 'proberca_node_network_receive_drop_total'
      label_mapping: &nic_labels {node: node, interface: interface}
      required_labels: &nic_required [node, interface]
      optional_labels: *host_optional
      series_labels: &nic_series [node, interface]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-nic-tx-drop
      component: node_nic_tx_drop_total
      promql: 'proberca_node_network_transmit_drop_total'
      label_mapping: *nic_labels
      required_labels: *nic_required
      optional_labels: *host_optional
      series_labels: *nic_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-nic-rx-error
      component: node_nic_rx_error_total
      promql: 'proberca_node_network_receive_error_total'
      label_mapping: *nic_labels
      required_labels: *nic_required
      optional_labels: *host_optional
      series_labels: *nic_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: host-nic-tx-error
      component: node_nic_tx_error_total
      promql: 'proberca_node_network_transmit_error_total'
      label_mapping: *nic_labels
      required_labels: *nic_required
      optional_labels: *host_optional
      series_labels: *nic_series
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0

    # TCP service-pair primitives.
    - query_id: tcp-edge-request-total
      component: edge_request_total
      promql: 'proberca_tcp_edge_request_total{source_coverage=~"0|1"}'
      label_mapping: &tcp_edge_labels
        namespace: namespace
        src_service: src_service
        dst_namespace: dst_namespace
        dst_service: dst_service
        protocol: protocol
        source_series: source_series
        source_coverage: source_coverage
      required_labels: &tcp_edge_required [namespace, src_service, dst_namespace, dst_service, protocol, source_series, source_coverage]
      optional_labels: &edge_optional [job, instance]
      series_labels: &tcp_edge_series [namespace, src_service, dst_namespace, dst_service, protocol, source_series]
      histogram_le_label: null
      value_scale: 1.0
      histogram_bound_scale: 1.0
    - query_id: tcp-edge-error-total
