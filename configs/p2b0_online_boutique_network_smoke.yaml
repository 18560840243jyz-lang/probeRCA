project_mode: single_vm_pseudo_distributed
phase: P2B-0
system: google_online_boutique
kubernetes:
  cluster_name: proberca-ob
  context: kind-proberca-ob
  namespace: online-boutique
kind_node_container: proberca-ob-control-plane
experiment:
  experiment_id: ob_network_shippingservice_smoke_001
  target_service: shippingservice
  target_metric: net.retrans
  target_fault_type: network instability
  symptom_service: frontend
  output_dir: data/p2_online_boutique/network_shippingservice_smoke_001
  frontend_url: http://127.0.0.1:8080
  requests_before: 20
  requests_during: 40
  requests_after: 20
  request_timeout_sec: 3
fault_injection:
  method: tc_netem_in_pod_netns
  target_service: shippingservice
  device: eth0
  delay_ms: 200
  jitter_ms: 50
  loss_percent: 2
  duration_sec: 60
  restore_after_fault: true
metrics:
  collect_proc_net_snmp: true
  collect_ss_rtt: true
  collect_tc_qdisc: true
  collect_cadvisor_network: true
disabled_for_this_step:
  - p1_rca_pipeline
  - prometheus
  - beyla
  - clickhouse
  - cpu_fault
  - io_fault
  - lock_fault
  - multi_fault_accuracy
  - adaptive_sampling_bandit
  - optional_drift
