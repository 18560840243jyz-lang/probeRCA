project_mode: single_vm_pseudo_distributed
phase: P2C-1
system: google_online_boutique

kubernetes:
  cluster_name: proberca-ob
  context: kind-proberca-ob
  namespace: online-boutique

repeat_experiment:
  experiment_group_id: ob_io_rediscart_repeated_001
  repeats: 5
  sleep_between_repeats_sec: 45
  base_output_dir: data/p2_online_boutique/io_rediscart_repeated

target:
  service: redis-cart
  metric: io.write_bytes
  fault_type: storage I/O
  symptom_service: frontend

fault_injection:
  method: pod_exec_dd_write_pressure
  target_service: redis-cart
  target_deployment: redis-cart
  target_container: redis
  temp_file_candidates:
    - /data/proberca_io_stress.bin
    - /tmp/proberca_io_stress.bin
  block_size: 1M
  block_count: 64
  duration_sec: 60
  cleanup_after_fault: true

experiment:
  window_size_sec: 5
  baseline_windows: 12
  faulty_windows: 12
  recovery_windows: 4
  frontend_url: http://127.0.0.1:8080
  requests_per_window: 50
  request_timeout_sec: 5

metrics:
  collect_cadvisor_fs: true
  collect_frontend_request_latency: true
  collect_pod_disk_free: true

quality_requirements:
  require_io_stress_started: true
  require_io_stress_cleaned: true
  require_rediscart_io_metric_present: true
  require_rediscart_write_bytes_metric_present: true
  require_frontend_latency_metric_present: true
  require_service_graph_present: true

evaluation_thresholds:
  repeats_completed_min: 5
  repeats_successful_quality_min: 5
  repeats_successful_rca_min: 5
  service_hit_at_1_mean_min: 0.8
  metric_hit_at_3_mean_min: 0.8
  root_type_accuracy_mean_min: 0.8
  path_fidelity_mean_min: 0.8

disabled_for_this_step:
  - cpu_fault
  - network_fault
  - lock_fault
  - multi_fault_accuracy
  - prometheus
  - beyla
  - clickhouse
  - adaptive_sampling_bandit
  - optional_drift
