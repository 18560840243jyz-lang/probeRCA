load_adjustment_reason: >-
  Three independent sequential checkout clients preserve the real business
  path. A separate fixed-rate label-free RPC workload keeps the service P95
  sample count above the quantile-derived alert eligibility floor without
  changing any validity or alert threshold. Checkout replicas are dephased by
  immutable Pod identity, and direct RPC workers are evenly phase-distributed
  across the unchanged period. Missed RPC deadlines are not replayed as a
  catch-up burst. The RPC workload is not a formal service or edge and is
  excluded from root-cause scope.
