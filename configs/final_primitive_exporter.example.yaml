schema_version: probeRCA-final-primitive-exporter-v5
cluster_id: kind-proberca-ob
kubeconfig_path: /home/jyz/.kube/config
kubernetes_context: kind-proberca-ob
namespaces:
  - online-boutique
  - kube-system
include_services:
  - online-boutique/adservice
  - online-boutique/cartservice
  - online-boutique/checkoutservice
  - online-boutique/currencyservice
  - online-boutique/emailservice
  - online-boutique/frontend
  - online-boutique/paymentservice
  - online-boutique/productcatalogservice
  - online-boutique/recommendationservice
  - online-boutique/redis-cart
  - online-boutique/shippingservice
  - kube-system/kube-dns
kind_node_container: proberca-ob-control-plane
beyla_port: 9400
node_exporter_url: http://127.0.0.1:9100/metrics
bpf_loader_path: /usr/local/lib/proberca-final/proberca-final-ebpf-loader
bpf_map_directory: /sys/fs/bpf/proberca-final
dns_aggregation_policy_path: /home/jyz/probeRCA/configs/final_dns_aggregation_policy.yaml
dns_timeout_ms: 5000
experimental_dns_enabled: false
listen_host: 127.0.0.1
listen_port: 9477
snapshot_period_sec: 1
source_timeout_sec: 5.0
# A slow Kubernetes API refresh must not drop a one-second acquisition target.
# The last verified immutable inventory may be reused only within this bound;
# every collected window still performs its independent runtime handshake.
inventory_max_staleness_sec: 30.0
# Five-second source deadlines at 1 Hz require six target slots: the five
# possibly in-flight seconds plus the next target that must start on time.
acquisition_max_pending: 6
beyla_acquisition_workers: 6
raw_acquisition_workers: 36
publish_queue_max_pending: 4
# Three 250 ms Prometheus scrape opportunities per ordered target.  A target
# that completed late remains HTTP-fresh for this full interval from its
# actual publication time; the exporter still becomes stale when publication
# stops.
publish_visibility_sec: 0.75
