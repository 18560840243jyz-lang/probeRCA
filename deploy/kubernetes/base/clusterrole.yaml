apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proberca-live-cluster-read
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["volumeattachments"]
  verbs: ["get", "list", "watch"]
