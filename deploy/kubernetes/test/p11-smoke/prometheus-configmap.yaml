apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global: {scrape_interval: 250ms, evaluation_interval: 1s}
    scrape_configs:
    - job_name: source
      static_configs: [{targets: ['metrics-source:8000']}]
    - job_name: target
      static_configs: [{targets: ['metrics-target:8000']}]
