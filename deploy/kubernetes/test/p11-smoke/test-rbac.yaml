apiVersion: v1
kind: ServiceAccount
metadata: {name: proberca-smoke}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: proberca-p11-smoke-reader}
rules:
- apiGroups: [""]
  resources: [pods, services, nodes, persistentvolumeclaims, persistentvolumes]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: proberca-p11-smoke-reader}
subjects:
- {kind: ServiceAccount, name: proberca-smoke, namespace: proberca-p11-smoke}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: proberca-p11-smoke-reader}
