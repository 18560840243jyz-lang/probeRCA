schema_version: proberca-healthy-probe-cadence-v4
namespace: online-boutique
readiness_period_seconds: 1
probe_profiles:
  default:
    liveness_initial_delay_seconds: 0
    liveness_failure_threshold: 3
    liveness_timeout_seconds: 1
    readiness_initial_delay_seconds: 0
    readiness_failure_threshold: 3
    readiness_timeout_seconds: 1
deployments:
  adservice:
    container: server
    liveness_period_seconds: 15
    probe_profile: default
  cartservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  checkoutservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
  currencyservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
  emailservice:
    service_contract:
      name: emailservice
      port: 5000
      targetPort: 8080
    strategic_merge_patch:
      spec:
        template:
          metadata:
            annotations:
              proberca.io/healthy-probe-cadence: exact-emailservice-grpc-v1
          spec:
            containers:
              - name: server
                startupProbe:
                  $patch: replace
                  grpc:
                    port: 8080
                  periodSeconds: 2
                  timeoutSeconds: 3
                  failureThreshold: 30
                readinessProbe:
                  $patch: replace
                  grpc:
                    port: 8080
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
                  successThreshold: 1
                livenessProbe:
                  $patch: replace
                  grpc:
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
  frontend:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  paymentservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
  productcatalogservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 400m
        memory: 128Mi
  recommendationservice:
    container: server
    liveness_period_seconds: 5
    probe_profile: default
    capacity_resources:
      requests:
        cpu: 100m
        memory: 220Mi
      limits:
        cpu: 500m
        memory: 450Mi
  redis-cart:
    container: redis
    liveness_period_seconds: 5
    probe_profile: default
  shippingservice:
    container: server
    liveness_period_seconds: 10
    probe_profile: default
