apiVersion: v1
kind: Namespace
metadata:
  name: proberca-dns-diagnostic
  labels:
    proberca.io/purpose: dns-transaction-diagnostic
---
apiVersion: v1
kind: Pod
metadata:
  name: proberca-dns-transaction-diagnostic
  namespace: proberca-dns-diagnostic
  labels:
    app: proberca-dns-transaction-diagnostic
    proberca.io/purpose: dns-transaction-diagnostic
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
    - name: resolver
      image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator@sha256:3e5cf93c21e6b7d1e8bb8713aa02c7912d4c9f90fd02d477b3d911bd02a292fb
      imagePullPolicy: IfNotPresent
      command: [python, -u, -c]
      args:
        - |
          import json
          import socket
          import time

          target = "kubernetes.default.svc.cluster.local."
          attempts = 60
          interval_seconds = 1.0
          startup_delay_seconds = 15.0

          print(json.dumps({
              "record_type": "diagnostic_start",
              "target": target,
              "attempts": attempts,
              "interval_seconds": interval_seconds,
              "startup_delay_seconds": startup_delay_seconds,
              "epoch_ns": time.time_ns(),
              "monotonic_ns": time.monotonic_ns(),
          }, sort_keys=True), flush=True)
          time.sleep(startup_delay_seconds)
          deadline = time.monotonic()
          for logical_index in range(attempts):
              epoch_start_ns = time.time_ns()
              monotonic_start_ns = time.monotonic_ns()
              addresses = []
              error = None
              try:
                  answers = socket.getaddrinfo(
                      target,
                      443,
                      family=socket.AF_INET,
                      type=socket.SOCK_STREAM,
                  )
                  addresses = sorted({
                      answer[4][0]
                      for answer in answers
                  })
              except OSError as exception:
                  error = repr(exception)
              epoch_end_ns = time.time_ns()
              monotonic_end_ns = time.monotonic_ns()
              print(json.dumps({
                  "record_type": "application_dns_lookup",
                  "logical_index": logical_index,
                  "target": target,
                  "qtype": "A",
                  "success": error is None,
                  "addresses": addresses,
                  "error": error,
                  "epoch_start_ns": epoch_start_ns,
                  "epoch_end_ns": epoch_end_ns,
                  "monotonic_start_ns": monotonic_start_ns,
                  "monotonic_end_ns": monotonic_end_ns,
                  "duration_ns": monotonic_end_ns - monotonic_start_ns,
              }, sort_keys=True), flush=True)
              deadline += interval_seconds
              remaining = deadline - time.monotonic()
              if remaining > 0:
                  time.sleep(remaining)
              else:
                  deadline = time.monotonic()
          print(json.dumps({
              "record_type": "diagnostic_complete",
              "epoch_ns": time.time_ns(),
              "monotonic_ns": time.monotonic_ns(),
          }, sort_keys=True), flush=True)
          time.sleep(7)
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
  securityContext:
    seccompProfile:
      type: RuntimeDefault
