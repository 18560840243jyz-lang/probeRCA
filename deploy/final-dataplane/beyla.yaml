apiVersion: v1
kind: Namespace
metadata:
  name: proberca-observe
  labels:
    app.kubernetes.io/part-of: proberca-final-dataplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proberca-beyla
  namespace: proberca-observe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proberca-beyla
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proberca-beyla
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proberca-beyla
subjects:
  - kind: ServiceAccount
    name: proberca-beyla
    namespace: proberca-observe
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proberca-beyla
  namespace: proberca-observe
data:
  beyla.yaml: |
    log_level: INFO
    shutdown_timeout: 20s
    discovery:
      instrument:
        - k8s_namespace: online-boutique
          k8s_deployment_name: adservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: cartservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: checkoutservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: currencyservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: emailservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: frontend
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: paymentservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: productcatalogservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: recommendationservice
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: redis-cart
          exports: [metrics]
        - k8s_namespace: online-boutique
          k8s_deployment_name: shippingservice
          exports: [metrics]
        - k8s_namespace: kube-system
          k8s_deployment_name: coredns
          exports: [metrics]
    attributes:
      kubernetes:
        enable: true
    routes:
      unmatched: heuristic
    ebpf:
      max_transaction_time: 30s
    prometheus_export:
      port: 9400
      path: /metrics
      ttl: 10m
      features:
        - application
      instrumentations: ["*"]
      buckets:
        duration_histogram:
          - 0.0005
          - 0.001
          - 0.002
          - 0.005
          - 0.01
          - 0.02
          - 0.05
          - 0.1
          - 0.2
          - 0.5
          - 1
          - 2
          - 5
          - 10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: proberca-beyla
  namespace: proberca-observe
  labels:
    app.kubernetes.io/name: proberca-beyla
    app.kubernetes.io/part-of: proberca-final-dataplane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: proberca-beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proberca-beyla
        app.kubernetes.io/part-of: proberca-final-dataplane
    spec:
      serviceAccountName: proberca-beyla
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: beyla
          image: grafana/beyla:3.15.0@sha256:162aac58cdb2245e5c948878473a1d4a9e197af4ec389450d3aa5b6d3fd80dc9
          imagePullPolicy: IfNotPresent
          args: ["-config", "/etc/proberca/beyla.yaml"]
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/proberca
              readOnly: true
            - name: temp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/beyla
      volumes:
        - name: config
          configMap:
            name: proberca-beyla
        - name: temp
          emptyDir: {}
        - name: run
          emptyDir: {}
