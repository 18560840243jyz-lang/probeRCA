apiVersion: v1
kind: ConfigMap
metadata:
  name: proberca-healthy-checkout-load
  namespace: online-boutique
  labels:
    app.kubernetes.io/name: proberca-healthy-checkout-load
    app.kubernetes.io/part-of: proberca-final-dataplane
data:
  checkout_driver.py: |
    from __future__ import annotations

    import hashlib
    import os
    import time

    import requests


    TARGET_URL = os.environ["TARGET_URL"].rstrip("/")
    INTERVAL_PATTERN_SECONDS = tuple(
        float(item)
        for item in os.environ["INTERVAL_PATTERN_SECONDS"].split(",")
    )
    PHASE_SECONDS = float(os.environ["PHASE_SECONDS"])
    POD_UID = os.environ["POD_UID"]
    PRODUCT_ID = "OLJCESPC7Z"
    CHECKOUT = {
        "email": "healthy-load@example.com",
        "street_address": "1600 Amphitheatre Parkway",
        "zip_code": "94043",
        "city": "Mountain View",
        "state": "CA",
        "country": "United States",
        "credit_card_number": "4111111111111111",
        "credit_card_expiration_month": "12",
        "credit_card_expiration_year": "2030",
        "credit_card_cvv": "123",
    }


    if (
        not INTERVAL_PATTERN_SECONDS
        or any(item <= 0 for item in INTERVAL_PATTERN_SECONDS)
        or PHASE_SECONDS <= 0
        or not POD_UID
    ):
        raise ValueError("healthy load timing must be positive")
    session = requests.Session()
    phase_fraction = int.from_bytes(
        hashlib.sha256(POD_UID.encode("utf-8")).digest()[:8], "big",
    ) / float(1 << 64)
    phase_offset_seconds = (
        phase_fraction
        * sum(INTERVAL_PATTERN_SECONDS)
        / len(INTERVAL_PATTERN_SECONDS)
    )
    started = time.monotonic()
    deadline = time.monotonic() + phase_offset_seconds
    time.sleep(max(0.0, deadline - time.monotonic()))
    while True:
        phase = int(
            (time.monotonic() - started) // PHASE_SECONDS
        ) % len(INTERVAL_PATTERN_SECONDS)
        deadline += INTERVAL_PATTERN_SECONDS[phase]
        try:
            response = session.post(
                f"{TARGET_URL}/cart",
                data={"product_id": PRODUCT_ID, "quantity": "1"},
                timeout=5,
            )
            response.raise_for_status()
            response = session.post(
                f"{TARGET_URL}/cart/checkout",
                data=CHECKOUT,
                timeout=10,
            )
            response.raise_for_status()
        except Exception as error:
            print(
                f"healthy checkout failed: {type(error).__name__}: {error}",
                flush=True,
            )
        remaining = deadline - time.monotonic()
        if remaining > 0:
            time.sleep(remaining)
        else:
            deadline = time.monotonic()
  rpc_driver.py: |
    from __future__ import annotations

    import os
    import threading
    import time

    import grpc
    import demo_pb2 as messages
    import demo_pb2_grpc as services


    PERIOD_SECONDS = float(os.environ["PERIOD_SECONDS"])
    WORKERS_PER_SERVICE = int(os.environ["WORKERS_PER_SERVICE"])
    if PERIOD_SECONDS <= 0 or WORKERS_PER_SERVICE <= 0:
        raise ValueError("healthy RPC load timing must be positive")

    address = messages.Address(
        street_address="1600 Amphitheatre Parkway",
        city="Mountain View",
        state="CA",
        country="US",
        zip_code=94043,
    )
    item = messages.CartItem(product_id="OLJCESPC7Z", quantity=1)
    money = messages.Money(currency_code="USD", units=1, nanos=0)
    card = messages.CreditCardInfo(
        credit_card_number="4111111111111111",
        credit_card_cvv=123,
        credit_card_expiration_year=2030,
        credit_card_expiration_month=12,
    )
    order = messages.OrderResult(
        order_id="healthy-probe",
        shipping_tracking_id="healthy-probe",
        shipping_cost=money,
        shipping_address=address,
    )
    channels = {
        "ad": grpc.insecure_channel("adservice:9555"),
        "cart": grpc.insecure_channel("cartservice:7070"),
        "currency": grpc.insecure_channel("currencyservice:7000"),
        "email": grpc.insecure_channel("emailservice:5000"),
        "payment": grpc.insecure_channel("paymentservice:50051"),
        "product": grpc.insecure_channel("productcatalogservice:3550"),
        "recommendation": grpc.insecure_channel("recommendationservice:8080"),
        "shipping": grpc.insecure_channel("shippingservice:50051"),
    }
    calls = {
        "ad": (
            services.AdServiceStub(channels["ad"]).GetAds,
            messages.AdRequest(context_keys=["healthy"]),
        ),
        "cart": (
            services.CartServiceStub(channels["cart"]).GetCart,
            messages.GetCartRequest(user_id="healthy-probe"),
        ),
        "currency": (
            services.CurrencyServiceStub(
                channels["currency"]
            ).GetSupportedCurrencies,
            messages.Empty(),
        ),
        "email": (
            services.EmailServiceStub(
                channels["email"]
            ).SendOrderConfirmation,
            messages.SendOrderConfirmationRequest(
                email="healthy-probe@example.com", order=order,
            ),
        ),
        "payment": (
            services.PaymentServiceStub(channels["payment"]).Charge,
            messages.ChargeRequest(amount=money, credit_card=card),
        ),
        "product": (
            services.ProductCatalogServiceStub(
                channels["product"]
            ).ListProducts,
            messages.Empty(),
        ),
        "recommendation": (
            services.RecommendationServiceStub(
                channels["recommendation"]
            ).ListRecommendations,
            messages.ListRecommendationsRequest(
                user_id="healthy-probe", product_ids=["OLJCESPC7Z"],
            ),
        ),
        "shipping": (
            services.ShippingServiceStub(channels["shipping"]).GetQuote,
            messages.GetQuoteRequest(address=address, items=[item]),
        ),
    }
    for channel in channels.values():
        grpc.channel_ready_future(channel).result(timeout=30)


    def worker(name: str, index: int) -> None:
        call, request = calls[name]
        service_index = service_names.index(name)
        worker_count = len(service_names) * WORKERS_PER_SERVICE
        worker_slot = service_index * WORKERS_PER_SERVICE + index
        phase_offset_seconds = (
            worker_slot * PERIOD_SECONDS / worker_count
        )
        deadline = time.monotonic() + phase_offset_seconds
        while True:
            time.sleep(max(0.0, deadline - time.monotonic()))
            try:
                call(request, timeout=5)
            except Exception as error:
                print(
                    f"healthy RPC {name} failed: "
                    f"{type(error).__name__}: {error}",
                    flush=True,
                )
            completed = time.monotonic()
            deadline += PERIOD_SECONDS
            if deadline <= completed:
                deadline = completed + PERIOD_SECONDS


    service_names = tuple(sorted(calls))
    threads = [
        threading.Thread(
            target=worker, args=(name, index), daemon=True,
        )
        for name in calls
        for index in range(WORKERS_PER_SERVICE)
    ]
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proberca-healthy-checkout-load
  namespace: online-boutique
  labels:
    app.kubernetes.io/name: proberca-healthy-checkout-load
    app.kubernetes.io/part-of: proberca-final-dataplane
  annotations:
    proberca.io/load-profile: single-vm-qualified-55
    proberca.io/load-profile-fingerprint: d3f0bffc6c26cb4d3f837d66eb62b5e377bae78b97522c5cefa75f3f0c2ee848
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: proberca-healthy-checkout-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proberca-healthy-checkout-load
        app.kubernetes.io/part-of: proberca-final-dataplane
      annotations:
        proberca.io/load-profile: single-vm-qualified-55
        proberca.io/load-profile-fingerprint: d3f0bffc6c26cb4d3f837d66eb62b5e377bae78b97522c5cefa75f3f0c2ee848
    spec:
      containers:
        - name: checkout-load
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator@sha256:3e5cf93c21e6b7d1e8bb8713aa02c7912d4c9f90fd02d477b3d911bd02a292fb
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /config/checkout_driver.py
          env:
            - name: TARGET_URL
              value: http://frontend
            - name: INTERVAL_PATTERN_SECONDS
              value: "0.127273,0.145455,0.163636,0.136364,0.154545"
            - name: PHASE_SECONDS
              value: "20"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: driver
              mountPath: /config
              readOnly: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: driver
          configMap:
            name: proberca-healthy-checkout-load
